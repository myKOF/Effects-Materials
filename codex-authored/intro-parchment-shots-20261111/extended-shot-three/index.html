<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>羊皮紙序章｜第三鏡審片</title>
<style>
@font-face { font-family: "Noto Serif TC"; src: url("../extended-shot-one/assets/noto-serif-tc-bold.woff2") format("woff2"); font-weight: 700; }
:root { color-scheme: dark; font-family: "Microsoft JhengHei", sans-serif; background: #15100d; color: #efe4cc; }
body { min-height: 100dvh; margin: 0; display: grid; place-items: center; }
main { width: min(100%, 1120px); }
canvas { display: block; width: 100%; height: auto; background: #000; }
.controls { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
button { font: inherit; padding: .4em .7em; min-width: 5em; }
input { flex: 1; min-width: 4em; accent-color: #d6b381; }
output { min-width: 5em; text-align: right; font-variant-numeric: tabular-nums; }
.capture .controls { display: none; }
.capture main { width: 100%; }
.capture body { display: block; }
</style>
</head>
<body>
<main>
  <canvas width="1920" height="1080" role="img" aria-label="羊皮紙地圖、荒漠神光與墜落的焦羽"></canvas>
  <div class="controls">
    <button type="button" disabled>播放</button>
    <input aria-label="播放進度" type="range" min="0" step="0.01" value="0" disabled>
    <output>0.00 秒</output>
  </div>
</main>
<audio preload="none" src="assets/shot-three-preview.wav"></audio>
<script src="shot-timing.js"></script>
<script src="shot-ground.js"></script>
<script src="shot-feather.js"></script>
<script src="shot-three.js"></script>
<script src="shot.js"></script>
<script src="preview.js"></script>
</body>
</html>
